# Novus OS - lib/ generic library, Rust part (README 16.4: C and Rust code
# are compiled separately and interact across an explicit FFI boundary).
#
# The UEFI build uses x86_64-pc-windows-msvc to produce COFF for the
# mingw PE32+ linker. The BIOS build separately uses x86_64-unknown-none
# to produce ELF for the raw-kernel linker. The BIOS build enables
# `bios-ms-abi` for Win64 C-facing exports; UEFI and host builds retain
# the target-native C ABI. Compiler runtime helpers always retain the
# target-native C ABI. No MSVC linker or
# libraries are invoked (no_std, zero dependencies, panic=abort).

[package]
name = "novuslib-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "novuslib_rs"
crate-type = ["staticlib"]

# Zero external dependencies by design: the kernel FFI surface must stay
# freestanding and auditable.
[dependencies]

[features]
bios-ms-abi = []

[profile.release]
panic = "abort"
