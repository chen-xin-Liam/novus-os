<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 960px; overflow: hidden; background: #07080B; }
  #stage { position: relative; width: 1280px; height: 960px; overflow: hidden; }
  #stage svg { position: absolute; inset: 0; width: 1280px; height: 960px; }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 1280 960" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0"   stop-color="#090B10"/>
      <stop offset="0.5" stop-color="#07080C"/>
      <stop offset="1"   stop-color="#04050A"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.5" cy="1.04" r="0.78">
      <stop offset="0"    stop-color="#8FA9D2" stop-opacity="0.13"/>
      <stop offset="0.42" stop-color="#63799F" stop-opacity="0.048"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.82">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.40"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1280" height="960" fill="url(#base)"/>
  <rect width="1280" height="960" fill="url(#lift)"/>

  <!-- two rings rising out of the bottom edge. The glow is three strokes of
       the same circle at falling opacity, not a blur filter: a blur leaves a
       smear on an 8-bit JPEG, three strokes stay clean. -->
  <g fill="none">
    <circle cx="640" cy="1012" r="742" stroke="#DCE7FA" stroke-opacity="0.022" stroke-width="9"/>
    <circle cx="640" cy="1012" r="742" stroke="#DCE7FA" stroke-opacity="0.040" stroke-width="4"/>
    <circle cx="640" cy="1012" r="742" stroke="#EAF2FF" stroke-opacity="0.075" stroke-width="1.4"/>

    <circle cx="640" cy="1012" r="548" stroke="#DCE7FA" stroke-opacity="0.014" stroke-width="7"/>
    <circle cx="640" cy="1012" r="548" stroke="#DCE7FA" stroke-opacity="0.028" stroke-width="3"/>
    <circle cx="640" cy="1012" r="548" stroke="#EAF2FF" stroke-opacity="0.055" stroke-width="1.2"/>
  </g>

  <rect width="1280" height="960" fill="url(#vig)"/>
  <rect width="1280" height="960" filter="url(#grain)" opacity="0.016"/>
</svg>
</div>
</body>
</html>
