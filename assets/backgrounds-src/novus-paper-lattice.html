<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 960px; overflow: hidden; background: #08090C; }
  #stage { position: relative; width: 1280px; height: 960px; overflow: hidden; }
  #stage svg { position: absolute; inset: 0; width: 1280px; height: 960px; }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 1280 960" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"    stop-color="#0C0E14"/>
      <stop offset="0.55" stop-color="#080A0F"/>
      <stop offset="1"    stop-color="#05060A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.44" r="0.5">
      <stop offset="0"    stop-color="#AFC4E4" stop-opacity="0.085"/>
      <stop offset="0.45" stop-color="#7189AE" stop-opacity="0.026"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask">
      <rect width="1280" height="960" fill="#000000"/>
      <rect width="1280" height="960" fill="url(#fade)"/>
    </mask>
    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.9">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.40"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1280" height="960" fill="url(#void)"/>
  <rect width="1280" height="960" fill="url(#halo)"/>

  <!-- A single 64 px ruling, no minor mesh: two densities at once read as
       graph paper, which is not what "quiet ruled sheet" means. Opacity is
       kept low enough that the grid stays a texture, not a pattern. -->
  <g mask="url(#gridmask)" stroke="#E8EFFA" stroke-opacity="0.075" stroke-width="1" shape-rendering="crispEdges">
    <line x1="64"  y1="0" x2="64"  y2="960"/><line x1="128" y1="0" x2="128" y2="960"/>
    <line x1="192" y1="0" x2="192" y2="960"/><line x1="256" y1="0" x2="256" y2="960"/>
    <line x1="320" y1="0" x2="320" y2="960"/><line x1="384" y1="0" x2="384" y2="960"/>
    <line x1="448" y1="0" x2="448" y2="960"/><line x1="512" y1="0" x2="512" y2="960"/>
    <line x1="576" y1="0" x2="576" y2="960"/><line x1="640" y1="0" x2="640" y2="960"/>
    <line x1="704" y1="0" x2="704" y2="960"/><line x1="768" y1="0" x2="768" y2="960"/>
    <line x1="832" y1="0" x2="832" y2="960"/><line x1="896" y1="0" x2="896" y2="960"/>
    <line x1="960" y1="0" x2="960" y2="960"/><line x1="1024" y1="0" x2="1024" y2="960"/>
    <line x1="1088" y1="0" x2="1088" y2="960"/><line x1="1152" y1="0" x2="1152" y2="960"/>
    <line x1="1216" y1="0" x2="1216" y2="960"/>

    <line x1="0" y1="64"  x2="1280" y2="64"/> <line x1="0" y1="128" x2="1280" y2="128"/>
    <line x1="0" y1="192" x2="1280" y2="192"/><line x1="0" y1="256" x2="1280" y2="256"/>
    <line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="384" x2="1280" y2="384"/>
    <line x1="0" y1="448" x2="1280" y2="448"/><line x1="0" y1="512" x2="1280" y2="512"/>
    <line x1="0" y1="576" x2="1280" y2="576"/><line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="0" y1="704" x2="1280" y2="704"/><line x1="0" y1="768" x2="1280" y2="768"/>
    <line x1="0" y1="832" x2="1280" y2="832"/><line x1="0" y1="896" x2="1280" y2="896"/>
  </g>

  <rect width="1280" height="960" fill="url(#vig)"/>
  <rect width="1280" height="960" filter="url(#grain)" opacity="0.014"/>
</svg>
</div>
</body>
</html>
