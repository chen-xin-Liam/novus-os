<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 960px; overflow: hidden; background: #05070B; }
  #stage { position: relative; width: 1280px; height: 960px; overflow: hidden; }
  #stage svg { position: absolute; inset: 0; width: 1280px; height: 960px; }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 1280 960" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"    stop-color="#0C1424"/>
      <stop offset="0.38" stop-color="#080E1A"/>
      <stop offset="1"    stop-color="#04060A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.66" cy="0.32" r="0.58">
      <stop offset="0"    stop-color="#CFE0FF" stop-opacity="0.185"/>
      <stop offset="0.30" stop-color="#9DB6E0" stop-opacity="0.075"/>
      <stop offset="0.68" stop-color="#6C81A8" stop-opacity="0.022"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.66" cy="0.32" r="0.20">
      <stop offset="0"   stop-color="#F0F6FF" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#F0F6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#AEC2E4" stop-opacity="0"/>
      <stop offset="0.26" stop-color="#AEC2E4" stop-opacity="0.09"/>
      <stop offset="0.62" stop-color="#E2ECFF" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#AEC2E4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#BFD2F2" stop-opacity="0.085"/>
      <stop offset="0.5" stop-color="#9DB6E0" stop-opacity="0.030"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.52" cy="0.42" r="0.82">
      <stop offset="0.52" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.44"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1280" height="960" fill="url(#sky)"/>
  <rect width="1280" height="960" fill="url(#halo)"/>
  <rect width="1280" height="960" fill="url(#core)"/>

  <!-- the water line: a hairline of light, then its own faint reflection -->
  <rect x="0" y="628" width="1280" height="160" fill="url(#mirror)"/>
  <rect x="0" y="627" width="1280" height="1.6" fill="url(#skyline)"/>
  <rect x="0" y="630" width="1280" height="1"   fill="#05070C" opacity="0.55"/>

  <rect width="1280" height="960" fill="url(#vig)"/>
  <rect width="1280" height="960" filter="url(#grain)" opacity="0.016"/>
</svg>
</div>
</body>
</html>
