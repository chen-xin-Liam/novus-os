<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 960px; overflow: hidden; background: #F4F3EF; }
  #stage { position: relative; width: 1280px; height: 960px; overflow: hidden; }
  #stage svg { position: absolute; inset: 0; width: 1280px; height: 960px; }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 1280 960" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0.08" y1="0" x2="0.4" y2="1">
      <stop offset="0"    stop-color="#FBFAF7"/>
      <stop offset="0.42" stop-color="#F5F4F0"/>
      <stop offset="1"    stop-color="#E8EAEF"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.10" cy="0.94" r="0.58">
      <stop offset="0"    stop-color="#FFD3AC" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FFE4CE" stop-opacity="0.10"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.94" cy="0.06" r="0.58">
      <stop offset="0" stop-color="#C3D1E7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#AEBACE" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#AEBACE" stop-opacity="0.075"/>
      <stop offset="1"    stop-color="#AEBACE" stop-opacity="0.115"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1280" height="960" fill="url(#paper)"/>
  <rect width="1280" height="960" fill="url(#warm)"/>
  <rect width="1280" height="960" fill="url(#cool)"/>

  <!-- concentric rings falling away from the top-right corner: barely there,
       they only give the sheet a direction -->
  <g stroke="#3A5680" fill="none">
    <circle cx="1176" cy="-72" r="372" stroke-opacity="0.070" stroke-width="1.3"/>
    <circle cx="1176" cy="-72" r="496" stroke-opacity="0.052" stroke-width="1.3"/>
    <circle cx="1176" cy="-72" r="640" stroke-opacity="0.036" stroke-width="1.3"/>
    <circle cx="1176" cy="-72" r="806" stroke-opacity="0.020" stroke-width="1.3"/>
  </g>

  <!-- daylight falling from the top, gone soft by the lower third -->
  <rect x="0" y="560" width="1280" height="400" fill="url(#shade)"/>

  <rect width="1280" height="960" filter="url(#grain)" opacity="0.026"/>
</svg>
</div>
</body>
</html>
