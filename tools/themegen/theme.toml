# Novus Fluent design tokens - the single source for C and Rust.
#
# Colours are semantic, never literal at a call site: the shell, the window
# manager, the installer and every built-in application read the same names,
# so light/dark are two resolutions of one palette instead of two palettes.
#
# Regenerate with:
#   python3 tools/themegen/themegen.py            # writes the generated files
#   python3 tools/themegen/themegen.py --check    # fails when they are stale
#
# The output is committed: the build does not depend on Python (same rule as
# the CJK font and the pinyin dictionary).

[meta]
version = "1.0"

[metrics]
radius_control = 6
radius_card = 10
radius_pill = 18
space_xs = 4
space_s = 8
space_m = 12
space_l = 16
space_xl = 24
control_h = 32
button_h = 36
row_h = 28
title_h = 32
shadow_spread = 14

[light]
canvas_top = "#EEF2F8"
canvas_bottom = "#E3EAF3"
surface = "#FFFFFF"
card = "#FBFBFD"
subtle = "#F0F2F5"
stroke = "#E1E5EA"
text = "#1B1B1B"
dim = "#5F6368"
accent = "#0067C0"
on_accent = "#FFFFFF"
success = "#107C10"
warn = "#B45309"
danger = "#C42B1C"
selection = "#E5F1FB"
shadow = "#000000"

# Seven desktop gradients; index order is the settings page order and the
# value the sysinfo theme service stores. Each pair matches the photo
# wallpaper of the same index in assets/backgrounds (top/bottom strip
# averages) and doubles as the picker swatch plus the fallback shown while
# the photo decodes.
[[light.wallpapers]]
top = "#9E8AB5"
bottom = "#0279A4"

[[light.wallpapers]]
top = "#BFE3C1"
bottom = "#25657D"

[[light.wallpapers]]
top = "#3499E4"
bottom = "#6FA5CE"

[[light.wallpapers]]
top = "#5B6D80"
bottom = "#2B4308"

[[light.wallpapers]]
top = "#813562"
bottom = "#7A1D74"

[[light.wallpapers]]
top = "#CC7505"
bottom = "#30221D"

[[light.wallpapers]]
top = "#733641"
bottom = "#7E475F"

[dark]
canvas_top = "#1A1E24"
canvas_bottom = "#11151A"
surface = "#202020"
card = "#272727"
subtle = "#2E2E2E"
stroke = "#3A3A3A"
text = "#F5F5F5"
dim = "#B8BCC2"
accent = "#4CC2FF"
on_accent = "#00243D"
success = "#6CCB5F"
warn = "#FCE100"
danger = "#FF99A4"
selection = "#1F3A4D"
shadow = "#000000"

# Dark mode: the same photos, dimmed towards the dark canvas.
[[dark.wallpapers]]
top = "#3A3145"
bottom = "#023A4E"

[[dark.wallpapers]]
top = "#3E5240"
bottom = "#12313D"

[[dark.wallpapers]]
top = "#1A4C77"
bottom = "#37566B"

[[dark.wallpapers]]
top = "#2D3740"
bottom = "#152208"

[[dark.wallpapers]]
top = "#401B31"
bottom = "#3D0E3A"

[[dark.wallpapers]]
top = "#663A02"
bottom = "#181110"

[[dark.wallpapers]]
top = "#391B20"
bottom = "#3E2330"
